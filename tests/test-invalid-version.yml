name: Test invalid version parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Setup Ghidra with invalid version
        uses: .
        continue-on-error: true
        with:
          version: "not-a-valid-version"
          sha256sum: online
          auth_token: ${{ github.token }}

      - name: Assert action failed with invalid version
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid version parameter"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid version 'not-a-valid-version'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
