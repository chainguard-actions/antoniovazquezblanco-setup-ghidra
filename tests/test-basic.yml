name: Test basic usage - latest Ghidra
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          sha256sum: "skip"
          auth_token: ${{ github.token }}
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: got version '$VERSION'"
      - name: Assert ghidraRun script exists
        run: |
          # Ghidra installs a ghidraRun script in its directory
          # The action should have added Ghidra to PATH or set GHIDRA_INSTALL_DIR
          if command -v ghidraRun > /dev/null 2>&1; then
            echo "PASS: ghidraRun found in PATH"
          else
            # Check common install locations
            FOUND=$(find /opt /home /usr/local /tmp -name "ghidraRun" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "PASS: ghidraRun found at $FOUND"
            else
              echo "FAIL: ghidraRun not found anywhere"
              exit 1
            fi
          fi
