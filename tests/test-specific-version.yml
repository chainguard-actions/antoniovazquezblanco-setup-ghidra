name: Test specific Ghidra version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "11.1.2"
          sha256sum: "skip"
          auth_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert GHIDRA_INSTALL_DIR env var is set
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR env var is empty"
            exit 1
          fi
          echo "PASS: GHIDRA_INSTALL_DIR is set to $GHIDRA_INSTALL_DIR"
      - name: Assert Ghidra version directory contains expected version string
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if echo "$GHIDRA_INSTALL_DIR" | grep -q "11.1.2"; then
            echo "PASS: install_dir contains expected version 11.1.2"
          else
            echo "WARN: install_dir does not contain '11.1.2', checking if ghidraRun exists anyway"
            if [ ! -f "$GHIDRA_INSTALL_DIR/ghidraRun" ]; then
              echo "FAIL: ghidraRun not found in $GHIDRA_INSTALL_DIR"
              exit 1
            fi
            echo "PASS: ghidraRun found"
          fi
      - name: Assert ghidraRun executable exists
        run: |
          if [ ! -f "$GHIDRA_INSTALL_DIR/ghidraRun" ]; then
            echo "FAIL: ghidraRun not found in $GHIDRA_INSTALL_DIR"
            exit 1
          fi
          echo "PASS: ghidraRun found at $GHIDRA_INSTALL_DIR/ghidraRun"
