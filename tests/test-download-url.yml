name: Test download_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          download_url: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.1.2_build/ghidra_11.1.2_PUBLIC_20240709.zip"
          sha256sum: "skip"
      - name: Assert Ghidra is installed
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR is not set"
            exit 1
          fi
          if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR does not point to a directory: $GHIDRA_INSTALL_DIR"
            exit 1
          fi
          echo "PASS: Ghidra installed at $GHIDRA_INSTALL_DIR"
