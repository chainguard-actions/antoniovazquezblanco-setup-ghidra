name: Test basic usage - parameter validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "not-a-valid-version"
          sha256sum: "skip"
        continue-on-error: true
      - name: Assert action failed with validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid version, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid version parameter"
