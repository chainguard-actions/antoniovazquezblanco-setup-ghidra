name: Test install from direct download_url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          download_url: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip"
          sha256sum: skip
          auth_token: ${{ github.token }}
      - name: Assert Ghidra installed from download_url
        env:
          VERSION: ${{ steps.action.outputs.version }}
          JAVA_VERSION: ${{ steps.action.outputs.java_version }}
        run: |
          echo "version: $VERSION"
          echo "java_version: $JAVA_VERSION"
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ] || [ ! -f "$GHIDRA_INSTALL_DIR/ghidraRun" ]; then
            echo "FAIL: ghidraRun not found in GHIDRA_INSTALL_DIR"
            exit 1
          fi
          if ! grep -q "11.0.3" "$GHIDRA_INSTALL_DIR/Ghidra/application.properties"; then
            echo "FAIL: installed Ghidra is not 11.0.3"
            exit 1
          fi
          if [ -n "$JAVA_VERSION" ] && ! echo "$JAVA_VERSION" | grep -qE '^[0-9]+$'; then
            echo "FAIL: java_version is not numeric"
            exit 1
          fi
          echo "PASS"
