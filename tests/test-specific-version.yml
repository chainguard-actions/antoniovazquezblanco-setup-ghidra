name: Test specific version - sha256sum validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-invalid-sha
        uses: .
        with:
          version: "11.1.2"
          sha256sum: "not-a-valid-sha256sum"
        continue-on-error: true
      - name: Assert action failed with invalid sha256sum
        env:
          OUTCOME: ${{ steps.action-invalid-sha.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid sha256sum, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid sha256sum parameter"
