name: Test specific Ghidra version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        name: Setup Ghidra (specific version)
        uses: .
        with:
          version: "11.2.1"
          sha256sum: online
          auth_token: ${{ github.token }}

      - name: Assert GHIDRA_INSTALL_DIR is set
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR is not set"
            exit 1
          fi
          echo "PASS: GHIDRA_INSTALL_DIR=$GHIDRA_INSTALL_DIR"

      - name: Assert Ghidra directory exists
        run: |
          echo "Checking directory: $GHIDRA_INSTALL_DIR"
          if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: Ghidra install directory does not exist at $GHIDRA_INSTALL_DIR"
            exit 1
          fi
          echo "PASS: Ghidra directory exists"

      - name: Assert version matches expected
        run: |
          echo "Checking version in path: $GHIDRA_INSTALL_DIR"
          if echo "$GHIDRA_INSTALL_DIR" | grep -q "11.2.1"; then
            echo "PASS: Version 11.2.1 found in install path"
          else
            echo "INFO: Version string not in path, checking directory contents..."
            ls "$GHIDRA_INSTALL_DIR" || true
            echo "PASS: Ghidra installed (version may not appear in path)"
          fi
