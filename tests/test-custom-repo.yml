name: Test custom owner and repo inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: "NationalSecurityAgency"
          repo: "ghidra"
          version: "latest"
          sha256sum: "skip"
      - name: Assert GHIDRA_INSTALL_DIR is set
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR is not set"
            exit 1
          fi
          echo "PASS: GHIDRA_INSTALL_DIR=$GHIDRA_INSTALL_DIR"
      - name: Assert Ghidra directory exists
        run: |
          echo "Checking directory: $GHIDRA_INSTALL_DIR"
          if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: Ghidra install directory does not exist"
            exit 1
          fi
          echo "PASS: Ghidra directory exists"
      - name: Assert Ghidra install dir contains 'ghidra' in path
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          case "$GHIDRA_INSTALL_DIR" in
            *ghidra* | *Ghidra*)
              echo "PASS: install dir path contains ghidra"
              ;;
            *)
              echo "FAIL: install dir path does not contain ghidra: $GHIDRA_INSTALL_DIR"
              exit 1
              ;;
          esac
