name: Test download_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          download_url: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.1.2_build/ghidra_11.1.2_PUBLIC_20240709.zip"
          sha256sum: "skip"
      - name: Assert GHIDRA_INSTALL_DIR is set
        env:
          GHIDRA_DIR: ${{ steps.action.outputs.install_path }}
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          echo "install_path output: $GHIDRA_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ] && [ -z "$GHIDRA_DIR" ]; then
            echo "FAIL: neither GHIDRA_INSTALL_DIR env var nor install_path output is set"
            exit 1
          fi
          echo "PASS"
      - name: Assert Ghidra directory exists
        run: |
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_INSTALL_DIR"
          if [ -n "$GHIDRA_INSTALL_DIR" ]; then
            if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
              echo "FAIL: GHIDRA_INSTALL_DIR does not point to a directory: $GHIDRA_INSTALL_DIR"
              exit 1
            fi
            echo "PASS: Ghidra directory exists at $GHIDRA_INSTALL_DIR"
          else
            echo "SKIP: GHIDRA_INSTALL_DIR not set, skipping directory check"
          fi
