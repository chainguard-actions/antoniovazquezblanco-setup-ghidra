name: Test download_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-populate tool cache for direct download_url scenario
        run: |
          set -e

          # Use a fixed fake download URL — this is what we'll pass as download_url input
          DOWNLOAD_URL="https://example.com/fake-ghidra-11.3_PUBLIC_20241127.zip"

          # Compute sha1 of the URL (same as the action does internally via crypto.createHash("sha1").update(url).digest("hex"))
          CACHE_VERSION=$(echo -n "$DOWNLOAD_URL" | sha1sum | awk '{print $1}')
          echo "Cache version key: $CACHE_VERSION"

          # Determine the tool cache directory
          if [ -n "$RUNNER_TOOL_CACHE" ]; then
            TOOL_CACHE="$RUNNER_TOOL_CACHE"
          elif [ -d "/opt/hostedtoolcache" ]; then
            TOOL_CACHE="/opt/hostedtoolcache"
          elif [ -d "/home/runner/work/_tool" ]; then
            TOOL_CACHE="/home/runner/work/_tool"
          else
            TOOL_CACHE="/opt/hostedtoolcache"
          fi
          echo "Using tool cache: $TOOL_CACHE"

          # Create fake Ghidra directory structure
          FAKE_GHIDRA_DIR="/tmp/fake-ghidra-download-url"
          mkdir -p "$FAKE_GHIDRA_DIR/support"
          printf '#!/bin/sh\necho "fake analyzeHeadless download-url"\n' > "$FAKE_GHIDRA_DIR/support/analyzeHeadless"
          chmod +x "$FAKE_GHIDRA_DIR/support/analyzeHeadless"
          echo 'fake ghidra download-url' > "$FAKE_GHIDRA_DIR/ghidraRun"

          # Populate the tool cache with the correct structure
          # @actions/tool-cache uses: RUNNER_TOOL_CACHE/<toolName>/<version>/<arch>/
          CACHE_DIR="$TOOL_CACHE/ghidra/$CACHE_VERSION/x64"
          mkdir -p "$CACHE_DIR"
          cp -r "$FAKE_GHIDRA_DIR/." "$CACHE_DIR/"
          # Create the completion marker file required by @actions/tool-cache
          touch "$TOOL_CACHE/ghidra/$CACHE_VERSION/x64.complete"
          echo "Pre-populated cache at: $CACHE_DIR"
          ls -la "$CACHE_DIR"

      - id: action
        uses: .
        with:
          download_url: "https://example.com/fake-ghidra-11.3_PUBLIC_20241127.zip"
          sha256sum: "skip"

      - name: Assert GHIDRA_INSTALL_DIR is set
        run: |
          echo "GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ -z "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: GHIDRA_INSTALL_DIR is not set"
            exit 1
          fi
          echo "PASS: GHIDRA_INSTALL_DIR is set to $GHIDRA_INSTALL_DIR"

      - name: Assert Ghidra directory exists
        run: |
          echo "Checking GHIDRA_INSTALL_DIR: $GHIDRA_INSTALL_DIR"
          if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
            echo "FAIL: Ghidra install directory does not exist: $GHIDRA_INSTALL_DIR"
            exit 1
          fi
          echo "PASS: Ghidra install directory exists"

      - name: Assert analyzeHeadless script is present
        run: |
          echo "Looking for analyzeHeadless in $GHIDRA_INSTALL_DIR"
          if [ ! -f "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" ]; then
            echo "FAIL: analyzeHeadless not found in $GHIDRA_INSTALL_DIR/support/"
            exit 1
          fi
          echo "PASS: analyzeHeadless found"
